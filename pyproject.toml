[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionops"
version = "0.1.0"
description = "Reproducible crowd-person dataset and ONNX inference pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<6",
  "pyyaml>=6,<7",
  "onnxruntime>=1.18,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "httpx>=0.27,<1"]
train = ["ultralytics>=8.3,<9", "onnx>=1.16,<2"]

[project.scripts]
visionops = "visionops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

